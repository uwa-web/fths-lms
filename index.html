      foot: `<button class="btn btn-quiet" data-close>Cancel</button><button class="btn btn-primary" id="imp-go">Import course</button>`
    });
    $('#imp-go', el).addEventListener('click', async (e) => {
      const btn = e.currentTarget; btn.disabled = true;
      $('#imp-msg').textContent = 'Importing…';
      try {
        let dates = {}, links = {};
        try { const s = await getDoc(doc(db, 'settings', 'course')); if (s.exists()) { dates = s.data().weekDates || {}; links = s.data().assessmentLinks || {}; } } catch {}
        const course = clone(STARTERS[LEGACY_ID]);
        course.weeks.forEach((w, i) => { const n = i + 1; if (dates[n]) w.unlockDate = String(dates[n]).slice(0, 10); if (links[n]) w.assessmentLink = links[n]; });
        await setDoc(doc(db, 'courses', LEGACY_ID), { ...course, updatedAt: serverTimestamp() });
        S.courses.set(LEGACY_ID, { id: LEGACY_ID, ...course });
        if ($('#grant-all').checked) await Promise.all(S.students.map(s => updateDoc(doc(db, 'users', s.uid), { courses: arrayUnion(LEGACY_ID) })));
        await ensureStudents(true);
        close(); toast('Course imported'); route();
      } catch (err) {
        console.error(err);
        $('#imp-msg').className = 'form-msg is-error';
        $('#imp-msg').textContent = 'Import didn’t finish. Make sure the new Firestore rules are published, then try again.';
        btn.disabled = false;
      }
    });
  }

  // ================= ADMIN: COURSE EDITOR =================
  const newSession = () => ({ id: 's' + rid(), title: '', video: '' });
  const newWeek = () => ({ id: 'w' + rid(), title: '', unlockDate: '', assessmentLink: '', sessions: [newSession()] });

  function renderEditor(id) {
    const isNew = id === 'new';
    if (!isNew && !S.courses.has(id)) { location.hash = '#/admin'; return; }
    if (S.draftId !== id || !S.draft) {
      S.draft = isNew
        ? { title: '', description: '', accent: ACCENTS[S.courses.size % ACCENTS.length], cover: '', resourcesLink: '', published: false, order: S.courses.size + 1, weeks: [newWeek()] }
        : clone(S.courses.get(id));
      delete S.draft.id; delete S.draft.updatedAt;
      S.draftId = id; S.draftDirty = false;
    }
    paintEditor(isNew);
  }

  function paintEditor(isNew) {
    const d = S.draft;
    let n = 0;
    appEl.innerHTML = `
      <div class="page">
        <a class="back dark" href="#/admin">${I.back} Courses</a>
        <div class="page-head" style="margin-top:.6rem">
          <div><h1>${isNew ? 'New course' : esc(d.title || 'Untitled course')}</h1><p>${isNew ? 'Set up the basics, then add weeks and sessions.' : `Course ID: ${esc(S.draftId)}`}</p></div>
        </div>
        <div class="editor" id="editor">
          <section class="panel">
            <h2>Course details</h2>
            <label class="field"><span>Title</span><input data-bind="title" value="${esc(d.title)}" placeholder="e.g. Upwork LaunchPad" maxlength="120"></label>
            <label class="field"><span>Short description <span class="hint">Shown on the student’s course card</span></span><textarea data-bind="description" maxlength="400">${esc(d.description)}</textarea></label>
            <div class="grid-2">
              <label class="field"><span>Cover image link <span class="hint">Optional. Leave blank to use the first video’s thumbnail</span></span><input type="url" data-bind="cover" value="${esc(d.cover || '')}" placeholder="https://..."></label>
              <label class="field"><span>Course resources link <span class="hint">Optional, e.g. a shared Drive folder</span></span><input type="url" data-bind="resourcesLink" value="${esc(d.resourcesLink)}" placeholder="https://drive.google.com/..."></label>
            </div>
            <div class="grid-2">
              <div class="field"><span>Course colour</span>
                <div class="swatches">${ACCENTS.map(c => `<label><input type="radio" name="accent" data-bind="accent" value="${c}" ${d.accent === c ? 'checked' : ''} aria-label="Colour ${c}"><span style="--c:${c}"></span></label>`).join('')}</div>
              </div>
              <label class="field"><span>Position in course list</span><input type="number" min="1" data-bind="order" value="${esc(d.order ?? 1)}"></label>
            </div>
            <label class="check"><input type="checkbox" data-bind="published" ${d.published !== false ? 'checked' : ''}><span><strong>Visible to enrolled students</strong><br><span class="small muted">Untick while you’re still building the course.</span></span></label>
          </section>

          ${d.weeks.map((w, wi) => `
            <section class="wk-edit">
              <div class="wk-edit-head">
                <strong>Week ${wi + 1}</strong>
                <div class="row" style="gap:4px">
                  <button class="icon-btn" data-act="mv-week" data-w="${wi}" data-dir="-1" ${wi === 0 ? 'disabled' : ''} aria-label="Move week up">${I.up}</button>
                  <button class="icon-btn" data-act="mv-week" data-w="${wi}" data-dir="1" ${wi === d.weeks.length - 1 ? 'disabled' : ''} aria-label="Move week down">${I.down}</button>
                  <button class="icon-btn" data-act="del-week" data-w="${wi}" aria-label="Remove week ${wi + 1}">${I.trash}</button>
                </div>
              </div>
              <div class="wk-edit-body">
                <div class="wk-fields">
                  <label class="field"><span>Week title</span><input data-bind="weeks.${wi}.title" value="${esc(w.title)}" placeholder="e.g. Setting up your profile"></label>
                  <label class="field"><span>Opens on <span class="hint">Blank = open now</span></span><input type="date" data-bind="weeks.${wi}.unlockDate" value="${esc(w.unlockDate)}"></label>
                  <label class="field"><span>External assessment link <span class="hint">Optional. Only shown if the week has no LMS assessment</span></span><input type="url" data-bind="weeks.${wi}.assessmentLink" value="${esc(w.assessmentLink)}" placeholder="https://..."></label>
                </div>
                <div class="s-rows">
                  ${w.sessions.map((s, si) => { n++; const vi = videoInfo(s.video); return `
                    <div class="s-row">
                      <span class="s-num">${n}</span>
                      <input class="input" data-bind="weeks.${wi}.sessions.${si}.title" value="${esc(s.title)}" placeholder="Session title" aria-label="Session ${n} title">
                      <div class="s-video">
                        <input class="input" data-bind="weeks.${wi}.sessions.${si}.video" value="${esc(s.video)}" placeholder="YouTube, Vimeo or Drive link" aria-label="Session ${n} video">
                        <small class="${s.video && !vi ? 'bad' : ''}">${s.video ? (vi ? vi.kind + ' video' : 'Not a recognised video link') : 'No video yet'}</small>
                      </div>
                      <div class="s-acts">
                        <button class="icon-btn" data-act="mv-sess" data-w="${wi}" data-s="${si}" data-dir="-1" ${si === 0 ? 'disabled' : ''} aria-label="Move session up">${I.up}</button>
                        <button class="icon-btn" data-act="mv-sess" data-w="${wi}" data-s="${si}" data-dir="1" ${si === w.sessions.length - 1 ? 'disabled' : ''} aria-label="Move session down">${I.down}</button>
                        <button class="icon-btn" data-act="del-sess" data-w="${wi}" data-s="${si}" aria-label="Remove session">${I.trash}</button>
                      </div>
                    </div>`; }).join('')}
                </div>
                <div><button class="btn btn-outline btn-sm" data-act="add-sess" data-w="${wi}">${I.plus} Add session</button></div>
              </div>
            </section>`).join('')}
          <div><button class="btn btn-outline" data-act="add-week">${I.plus} Add week</button></div>
        </div>
      </div>
      <div class="savebar"><div class="savebar-inner">
        <div class="row">
          ${isNew ? '' : `<button class="btn btn-danger btn-sm" data-act="delete-course">Delete course</button>`}
          <span class="status" id="save-status">${S.draftDirty ? 'Unsaved changes' : ''}</span>
        </div>
        <div class="row">
          ${isNew ? '' : `<a class="btn btn-quiet btn-sm" href="${courseHref(S.draftId)}">Preview</a>`}
          <button class="btn btn-primary" data-act="save">${isNew ? 'Create course' : 'Save changes'}</button>
        </div>
      </div></div>`;

    const ed = $('#editor');
    const markDirty = () => { S.draftDirty = true; $('#save-status').textContent = 'Unsaved changes'; };
    const setPath = (path, val) => { const keys = path.split('.'); let o = S.draft; keys.slice(0, -1).forEach(k => o = o[k]); o[keys.at(-1)] = val; };
    const onField = (e) => {
      const b = e.target.dataset.bind; if (!b) return;
      const val = e.target.type === 'checkbox' ? e.target.checked : e.target.type === 'number' ? Number(e.target.value) : e.target.value;
      setPath(b, val); markDirty();
      if (b.endsWith('.video')) {
        const small = e.target.nextElementSibling, vi = videoInfo(val);
        small.textContent = val ? (vi ? vi.kind + ' video' : 'Not a recognised video link') : 'No video yet';
        small.className = val && !vi ? 'bad' : '';
      }
    };
    ed.addEventListener('input', onField);
    ed.addEventListener('change', onField);

    const structural = (fn) => { fn(); S.draftDirty = true; const y = window.scrollY; paintEditor(isNew); window.scrollTo(0, y); };
    const onAct = async (e) => {
      const b = e.target.closest('[data-act]'); if (!b) return;
      const act = b.dataset.act, wi = +b.dataset.w, si = +b.dataset.s, dir = +b.dataset.dir;
      const W = S.draft.weeks;
      if (act === 'add-week') structural(() => W.push(newWeek()));
      if (act === 'add-sess') structural(() => W[wi].sessions.push(newSession()));
      if (act === 'mv-week') structural(() => W.splice(wi + dir, 0, W.splice(wi, 1)[0]));
      if (act === 'mv-sess') structural(() => { const L = W[wi].sessions; L.splice(si + dir, 0, L.splice(si, 1)[0]); });
      if (act === 'del-sess') {
        const s = W[wi].sessions[si];
        if ((s.title || s.video) && !confirm(`Remove “${s.title || 'this session'}”? Students’ completion of it will no longer count.`)) return;
        structural(() => W[wi].sessions.splice(si, 1));
      }
      if (act === 'del-week') {
        if (W[wi].sessions.length && !confirm(`Remove week ${wi + 1} and its ${plural(W[wi].sessions.length, 'session')}?`)) return;
        structural(() => W.splice(wi, 1));
      }
      if (act === 'save') await saveDraft(isNew, b);
      if (act === 'delete-course') confirmDeleteCourse();
    };
    ed.addEventListener('click', onAct);
    $('.savebar').addEventListener('click', onAct);
  }

  async function saveDraft(isNew, btn) {
    const d = S.draft;
    d.title = (d.title || '').trim();
    if (!d.title) { toast('Give the course a title before saving.', 'error'); $('[data-bind="title"]')?.focus(); return; }
    const untitled = d.weeks.flatMap(w => w.sessions).filter(s => !s.title.trim()).length;
    if (untitled) { toast(`${plural(untitled, 'session')} still need${untitled === 1 ? 's' : ''} a title.`, 'error'); return; }
    btn.disabled = true; $('#save-status').textContent = 'Saving…';
    try {
      let id = S.draftId;
      if (isNew) { const base = slugify(d.title); id = base; let i = 2; while (S.courses.has(id)) id = `${base}-${i++}`; }
      const data = clone(d);
      await setDoc(doc(db, 'courses', id), { ...data, updatedAt: serverTimestamp() });
      S.courses.set(id, { id, ...data });
      S.draftDirty = false;
      toast(isNew ? 'Course created' : 'Changes saved');
      paintSide();
      if (isNew) { S.draftId = id; location.hash = `#/admin/course/${encodeURIComponent(id)}`; }
      else { $('#save-status').textContent = 'All changes saved'; btn.disabled = false; }
    } catch (err) {
      console.error(err); btn.disabled = false;
      $('#save-status').textContent = 'Not saved';
      toast('The course didn’t save. Check your connection and try again.', 'error');
    }
  }

  function confirmDeleteCourse() {
    const id = S.draftId, c = S.courses.get(id);
    const { el, close } = openModal({
      title: 'Delete this course?',
      body: `<p>“${esc(c.title)}” will be removed for every student. Their progress records stay in the database, so re-creating a course with the ID <strong>${esc(id)}</strong> would restore them.</p>
        <label class="field"><span>Type DELETE to confirm</span><input id="del-confirm" autocomplete="off"></label>`,
      foot: `<button class="btn btn-quiet" data-close>Cancel</button><button class="btn btn-danger" id="del-go" disabled>Delete course</button>`
    });
    const inp = $('#del-confirm', el), go = $('#del-go', el);
    inp.addEventListener('input', () => go.disabled = inp.value.trim() !== 'DELETE');
    go.addEventListener('click', async () => {
      go.disabled = true;
      try {
        await deleteDoc(doc(db, 'courses', id));
        const students = await ensureStudents();
        await Promise.all(students.filter(s => s.courses.includes(id)).map(s => updateDoc(doc(db, 'users', s.uid), { courses: arrayRemove(id) }).then(() => { s.courses = s.courses.filter(x => x !== id); })));
        S.courses.delete(id); S.draft = null; S.draftId = null; S.draftDirty = false;
        close(); toast('Course deleted'); location.hash = '#/admin';
      } catch (err) { console.error(err); toast('The course couldn’t be deleted.', 'error'); go.disabled = false; }
    });
  }

  // ================= ADMIN: STUDENTS =================
  async function renderStudents() {
    adminLoading();
    try { await ensureStudents(); } catch (e) { console.error(e); appEl.innerHTML = `<div class="page"><div class="empty"><h2>Students didn’t load</h2><p>Check that the new Firestore rules are published, then refresh.</p></div></div>`; return; }
    const courses = sortedCourses();
    if (!S.studentCourse || !S.courses.has(S.studentCourse)) S.studentCourse = courses[0]?.id || null;
    appEl.innerHTML = `
      <div class="page">
        <div class="page-head">
          <div><h1>Students</h1><p id="st-sub">${plural(S.students.length, 'student')}. Each student only sees the courses ticked for them.</p></div>
          <div class="row wrap">
            <button class="btn btn-outline" id="export-btn" ${S.studentCourse ? '' : 'disabled'}>Export CSV</button>
            <button class="btn btn-primary" id="add-btn" ${courses.length ? '' : 'disabled'}>${I.plus} Add students</button>
          </div>
        </div>
        <div class="toolbar">
          <input class="input" type="search" id="st-search" placeholder="Search by name or email" value="${esc(S.studentFilter)}" aria-label="Search students">
          <select class="input" id="st-course" aria-label="Show progress for course">
            ${courses.map(c => `<option value="${esc(c.id)}" ${c.id === S.studentCourse ? 'selected' : ''}>Progress in ${esc(c.title)}</option>`).join('')}
          </select>
        </div>
        <div class="table-wrap"><table>
          <thead><tr><th>Student</th><th>Registered courses</th><th>Progress</th><th><span class="visually-hidden">Actions</span></th></tr></thead>
          <tbody id="st-body"></tbody>
        </table></div>
      </div>`;
    paintStudentRows();
    $('#st-search').addEventListener('input', (e) => { S.studentFilter = e.target.value; paintStudentRows(); });
    $('#st-course').addEventListener('change', (e) => { S.studentCourse = e.target.value; paintStudentRows(); });
    $('#add-btn').addEventListener('click', openAddStudents);
    $('#export-btn').addEventListener('click', exportCsv);
  }

  function filteredStudents() {
    const q = S.studentFilter.toLowerCase().trim();
    return S.students.filter(s => !q || s.email.toLowerCase().includes(q) || studentName(s).toLowerCase().includes(q));
  }

  function paintStudentRows() {
    const body = $('#st-body'); if (!body) return;
    const rows = filteredStudents();
    const course = S.courses.get(S.studentCourse);
    if (!rows.length) { body.innerHTML = `<tr><td colspan="4" class="muted" style="text-align:center;padding:36px">${S.students.length ? 'No students match that search.' : 'No students yet. Use “Add students” to invite your first learners.'}</td></tr>`; return; }
    body.innerHTML = rows.map(s => {
      const chips = s.courses.filter(id => S.courses.has(id)).map(id => `<span class="chip">${esc(S.courses.get(id).title)}</span>`).join('') || '<span class="small muted">None yet</span>';
      let prog = '<span class="small muted">Not registered</span>';
      if (course && s.courses.includes(course.id)) {
        const st = courseStats(course, s.progress.get(course.id));
        prog = `<div class="prog-cell"><div class="pbar"><span style="width:${st.pct}%"></span></div><button data-detail="${esc(s.uid)}" aria-expanded="false">${st.done}/${st.total}</button></div>`;
      }
      return `<tr data-uid="${esc(s.uid)}">
        <td><div class="who-cell"><span class="avatar sm plain">${esc(initials(studentName(s)))}</span><div style="min-width:0"><strong>${esc(studentName(s))}</strong><span>${esc(s.email)}</span></div></div></td>
        <td><div class="chips">${chips}</div></td>
        <td>${prog}</td>
        <td style="text-align:right"><button class="btn btn-outline btn-sm" data-manage="${esc(s.uid)}">Manage</button></td>
      </tr>`;
    }).join('');
    $$('[data-manage]', body).forEach(b => b.addEventListener('click', () => openManageStudent(S.students.find(s => s.uid === b.dataset.manage))));
    $$('[data-detail]', body).forEach(b => b.addEventListener('click', () => {
      const tr = b.closest('tr'), nx = tr.nextElementSibling;
      if (nx?.classList.contains('detail-row')) { nx.remove(); b.setAttribute('aria-expanded', 'false'); return; }
      $$('.detail-row', body).forEach(r => r.remove());
      const s = S.students.find(x => x.uid === b.dataset.detail), done = s.progress.get(course.id) || new Set();
      const titles = sessionsOf(course).filter(x => done.has(x.s.id)).map(x => `<li>Session ${x.n}: ${esc(x.s.title)}</li>`);
      const row = document.createElement('tr'); row.className = 'detail-row';
      row.innerHTML = `<td colspan="4"><strong>Completed in ${esc(course.title)}</strong>${titles.length ? `<ul>${titles.join('')}</ul>` : '<p class="small muted" style="margin-top:.3rem">Nothing completed yet.</p>'}</td>`;
      tr.after(row); b.setAttribute('aria-expanded', 'true');
    }));
  }

  function courseChecks(selected = []) {
    return `<div class="field"><span>Registered for</span>${sortedCourses().map(c => `
      <label class="check"><input type="checkbox" name="course" value="${esc(c.id)}" ${selected.includes(c.id) ? 'checked' : ''}><span>${esc(c.title)}${c.published === false ? ' <span class="chip draft">Hidden</span>' : ''}</span></label>`).join('')}</div>`;
  }

  function openManageStudent(s) {
    const { el, close } = openModal({
      title: studentName(s),
      body: `<p class="small muted" style="margin-top:-.4rem">${esc(s.email)}</p>
        ${courseChecks(s.courses)}
        <div class="panel" style="padding:14px;gap:8px;background:#fbfaf8;border-radius:14px">
          <strong>Can’t sign in?</strong>
          <p class="small muted">The welcome email links to the password setup page, and never expires. A password link works for 1 hour only.</p>
          <div class="row wrap" style="gap:8px"><button class="btn btn-outline btn-sm" id="ms-welcome">Resend welcome email</button><button class="btn btn-quiet btn-sm" id="ms-reset">Send password link</button></div>
        </div>
        <p class="form-msg" id="ms-msg"></p>`,
      foot: `<button class="btn btn-quiet" data-close>Cancel</button><button class="btn btn-primary" id="ms-save">Save courses</button>`
    });
    $('#ms-reset', el).addEventListener('click', async (e) => {
      const btn = e.currentTarget; btn.disabled = true;
      try { await sendPasswordLink(s.email); $('#ms-msg').className = 'form-msg is-ok'; $('#ms-msg').textContent = `Password link sent to ${s.email}. It works for 1 hour.`; }
      catch (err) { console.error(err); $('#ms-msg').className = 'form-msg is-error'; $('#ms-msg').textContent = 'The email didn’t send. Try again.'; btn.disabled = false; }
    });
    $('#ms-welcome', el).addEventListener('click', async (e) => {
      const btn = e.currentTarget; btn.disabled = true;
      const r = await sendWelcome(s, s.courses);
      $('#ms-msg').className = 'form-msg ' + (r.ok ? 'is-ok' : 'is-error');
      $('#ms-msg').textContent = r.ok ? `Welcome email sent to ${s.email}.` : `The email didn’t send: ${r.error}`;
      btn.disabled = false;
    });
    $('#ms-save', el).addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      const chosen = $$('input[name=course]:checked', el).map(i => i.value);
      const keep = s.courses.filter(id => !S.courses.has(id));
      const next = [...new Set([...keep, ...chosen])];
      btn.disabled = true;
      try {
        await updateDoc(doc(db, 'users', s.uid), { courses: next });
        s.courses = next;
        await Promise.all(next.filter(cid => S.courses.has(cid) && !s.progress.has(cid)).map(async cid => {
          try { const p = await getDoc(progressRef(s.uid, cid)); s.progress.set(cid, new Set(p.exists() ? (p.data().completedSessions || []) : [])); } catch { s.progress.set(cid, new Set()); }
        }));
        close(); toast('Courses updated'); paintStudentRows();
      } catch (err) { console.error(err); btn.disabled = false; $('#ms-msg').className = 'form-msg is-error'; $('#ms-msg').textContent = 'Changes didn’t save. Try again.'; }
    });
  }

  function openAddStudents() {
    const { el } = openModal({
      title: 'Add students',
      body: `
        <p class="small muted" style="margin-top:-.4rem">Each student gets a welcome email from First Tech Hub Solutions with a link to set up their password. The link doesn’t expire. Students who already have an account get an email about their new course.</p>
        <label class="field"><span>Students <span class="hint">One per line: full name, email address</span></span>
          <textarea id="as-lines" rows="6" placeholder="Ada Okafor, ada@example.com&#10;Tunde Bello, tunde@example.com"></textarea></label>
        ${courseChecks(S.studentCourse ? [S.studentCourse] : [])}
        <ul class="result-list" id="as-results"></ul>`,
      foot: `<button class="btn btn-quiet" data-close>Close</button><button class="btn btn-primary" id="as-go">Add and send invites</button>`
    });
    $('#as-go', el).addEventListener('click', async (e) => {
      const btn = e.currentTarget;
      const courses = $$('input[name=course]:checked', el).map(i => i.value);
      const lines = $('#as-lines', el).value.split('\n').map(l => l.trim()).filter(Boolean);
      const out = $('#as-results', el);
      if (!lines.length) { out.innerHTML = '<li class="err">Add at least one student.</li>'; return; }
      if (!courses.length) { out.innerHTML = '<li class="err">Choose the course they registered for.</li>'; return; }
      btn.disabled = true; out.innerHTML = '';
      for (const line of lines) {
        const m = line.match(/^(.*?)[,;\t]\s*([^\s,;]+@[^\s,;]+)\s*$/) || line.match(/^()\s*([^\s,;]+@[^\s,;]+)\s*$/);
        const li = document.createElement('li'); out.appendChild(li);
        if (!m) { li.className = 'err'; li.textContent = `“${line}”: couldn’t find an email address on this line.`; continue; }
        const name = m[1].trim(), email = m[2].toLowerCase();
        li.textContent = `${email}: working…`;
        try { const res = await addStudent(name, email, courses); li.className = 'ok'; li.textContent = `${email}: ${res}`; }
        catch (err) { console.error(err); li.className = 'err'; li.textContent = `${email}: ${err.friendly || AUTH_ERRORS[err.code] || 'couldn’t be added.'}`; }
      }
      btn.disabled = false; btn.textContent = 'Add more';
      $('#as-lines', el).value = '';
      paintStudentRows();
      const h = $('#st-sub'); if (h) h.textContent = `${plural(S.students.length, 'student')}. Each student only sees the courses ticked for them.`;
    });
  }

  // Branded welcome email. Its link opens the LMS "Set up your password" page, so it never expires.
  function sendWelcome(s, courseIds, existing = false) {
    const titles = courseIds.map(id => S.courses.get(id)?.title).filter(Boolean);
    return notifyStudent({ type: 'welcome', to: s.email, studentName: s.fullName || s.displayName || '', courses: titles, existing,
      setupUrl: `${location.origin}${location.pathname}#/setup?email=${encodeURIComponent(s.email)}` });
  }

  async function addStudent(name, email, courses) {
    const existing = S.students.find(s => s.email.toLowerCase() === email);
    if (existing) {
      const added = courses.filter(c => !existing.courses.includes(c));
      await updateDoc(doc(db, 'users', existing.uid), { courses: arrayUnion(...courses) });
      existing.courses = [...new Set([...existing.courses, ...courses])];
      courses.forEach(c => existing.progress.has(c) || existing.progress.set(c, new Set()));
      if (!added.length) return 'already had an account and this course. Nothing changed.';
      const r = await sendWelcome(existing, added, true);
      return r.ok ? 'already had an account. Course added and email sent.' : `already had an account. Course added, but the email didn’t send (${r.error})`;
    }
    const sec = getSecondaryAuth();
    const pw = Array.from(crypto.getRandomValues(new Uint8Array(24)), b => (b % 36).toString(36)).join('') + 'A1!';
    let cred;
    try { cred = await createUserWithEmailAndPassword(sec, email, pw); }
    catch (err) {
      if (err.code === 'auth/email-already-in-use') { const e = new Error(); e.friendly = 'has a login but no student record. Ask them to sign in once (or use “Forgot password”), then add their course from the list.'; throw e; }
      if (err.code === 'auth/operation-not-allowed' || err.code === 'auth/admin-restricted-operation') { const e = new Error(); e.friendly = 'new sign-ups are switched off in Firebase Authentication. See the setup notes.'; throw e; }
      throw err;
    }
    const uid = cred.user.uid;
    await signOut(sec).catch(() => {});
    const displayName = name || email.split('@')[0];
    await setDoc(doc(db, 'users', uid), { email, uid, fullName: name, displayName, courses, createdAt: serverTimestamp(), invitedAt: serverTimestamp() });
    await setDoc(doc(db, 'profiles', uid), { displayName }).catch(() => {});
    const student = { uid, email, fullName: name, displayName, courses, progress: new Map(courses.map(c => [c, new Set()])), progressAt: new Map() };
    S.students.push(student);
    S.students.sort((a, b) => studentName(a).localeCompare(studentName(b)));
    const r = await sendWelcome(student, courses);
    if (r.ok) return 'account created, welcome email sent.';
    // Mailer not reachable: fall back to Firebase's own (1-hour) password email
    await sendPasswordLink(email).catch(() => {});
    return `account created. The welcome email didn’t send (${r.error}), so Firebase’s password email was sent instead. It expires after 1 hour.`;
  }

  function exportCsv() {
    const course = S.courses.get(S.studentCourse); if (!course) return;
    const cell = (v) => `"${String(v ?? '').replace(/"/g, '""')}"`;
    const all = sessionsOf(course);
    const rows = [['Name', 'Email', 'Registered', 'Completed sessions', 'Total sessions', 'Progress (%)', 'Completed session titles']];
    filteredStudents().forEach(s => {
      const enrolled = s.courses.includes(course.id);
      const done = s.progress.get(course.id) || new Set();
      const st = courseStats(course, done);
      rows.push([studentName(s), s.email, enrolled ? 'Yes' : 'No', st.done, st.total, st.pct, all.filter(x => done.has(x.s.id)).map(x => x.s.title).join('; ')]);
    });
    const blob = new Blob(['﻿' + rows.map(r => r.map(cell).join(',')).join('\r\n')], { type: 'text/csv;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `${slugify(course.title)}-progress.csv`;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1000);
  }

  // ================= ASSESSMENTS: SHARED =================
  const subRef = (aid, uid) => doc(db, 'assessments', aid, 'submissions', uid);
  const parseDue = (s) => { if (!s) return null; const d = new Date(s); return isNaN(d) ? null : d; };
  const fmtDue = (s) => { const d = parseDue(s); return d ? d.toLocaleString('en-GB', { weekday: 'short', day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : 'No due date'; };
  const tsDate = (t) => t?.toDate ? t.toDate() : (t instanceof Date ? t : null);
  const fmtTs = (t) => { const d = tsDate(t); return d ? d.toLocaleString('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) : 'Just now'; };
  const linkify = (t) => esc(t).replace(/https?:\/\/[^\s<]+/g, u => `<a href="${u}" target="_blank" rel="noopener">${u}</a>`);
  const pointsOf = (a) => Number(a.points) > 0 ? Number(a.points) : 100;
  const fmtSize = (n) => n > 1048576 ? (n / 1048576).toFixed(1) + ' MB' : Math.max(1, Math.round(n / 1024)) + ' KB';
  
  function assessWeek(a) {
    const c = S.courses.get(a.courseId);
    if (!c || !a.weekId) return null;
    const wi = (c.weeks || []).findIndex(w => w.id === a.weekId);
    return wi < 0 ? null : { w: c.weeks[wi], wi };
  }
  const assessOpen = (a) => { const wk = assessWeek(a); return !wk || weekOpen(wk.w); };
  const assessList = () => [...S.assess.values()].filter(a => S.courses.has(a.courseId))
    .sort((a, b) => (parseDue(a.dueDate)?.getTime() ?? 9e15) - (parseDue(b.dueDate)?.getTime() ?? 9e15) || String(a.title).localeCompare(String(b.title)));

  function statusOf(a, sub) {
    const due = parseDue(a.dueDate), now = Date.now();
    if (sub?.status === 'returned') return { key: 'graded', label: sub.grade != null && sub.grade !== '' ? `${sub.grade}/${pointsOf(a)}` : 'Returned', cls: 'st-graded' };
    if (sub?.status === 'submitted') {
      const at = tsDate(sub.submittedAt), late = due && at && at > due;
      return { key: 'turned', label: late ? 'Turned in late' : 'Turned in', cls: late ? 'st-late' : 'st-turned' };
    }
    if (due && now > due.getTime()) return { key: 'missing', label: 'Missing', cls: 'st-missing' };
    if (due && due.getTime() - now < 3 * 864e5) return { key: 'todo', label: 'Due soon', cls: 'st-soon' };
    return { key: 'todo', label: 'Assigned', cls: 'st-todo' };
  }

  function linkName(u) {
    if (/docs\.google\.com\/document/.test(u)) return 'Google Doc';
    if (/docs\.google\.com\/spreadsheets/.test(u)) return 'Google Sheet';
    if (/docs\.google\.com\/presentation/.test(u)) return 'Google Slides';
    if (/docs\.google\.com\/forms|forms\.gle/.test(u)) return 'Google Form';
    if (/drive\.google\.com/.test(u)) return 'Google Drive file';
    try { return new URL(u).hostname.replace(/^www\./, ''); } catch { return 'Link'; }
  }

  function attachListHTML(list, editable) {
    if (!list?.length) return '';
    return `<ul class="att-list">${list.map((f, i) => `
      <li class="att"><span class="att-ic">${f.type === 'link' ? I.link : I.file}</span>
        <a class="att-name" href="${esc(safeUrl(f.url))}" target="_blank" rel="noopener" title="${esc(f.url)}">${esc(f.name)}</a>
        ${f.size ? `<span class="att-meta">${fmtSize(f.size)}</span>` : ''}
        ${editable ? `<button type="button" class="icon-btn att-del" data-att-del="${i}" aria-label="Remove ${esc(f.name)}">${I.close}</button>` : ''}</li>`).join('')}</ul>`;
  }

  // Link picker (no file uploads: everything is shared as links, e.g. Google Drive, Docs, Forms).
  // get() returns the list; set(list) stores it (may be async).
  function mountAttach(el, { get, set, editable = () => true, emptyText = '', placeholder = 'Paste a link, e.g. a Google Doc or Drive file' }) {
    const paint = () => {
      const ed = editable();
      const list = get() || [];
      el.innerHTML = `${attachListHTML(list, ed) || (emptyText ? `<p class="small muted">${esc(emptyText)}</p>` : '')}
        ${ed ? `<div class="att-add"><form class="att-link"><input class="input" type="url" placeholder="${esc(placeholder)}" aria-label="Link"><button class="btn btn-outline btn-sm" type="submit">${I.link} Add link</button></form></div>
        <p class="small muted" style="margin-top:6px">For Google Drive files, set sharing to “Anyone with the link can view” so your tutor can open them.</p>` : ''}`;
      if (!ed) return;
      const save = async (next) => { try { await set(next); return true; } catch (e) { console.error(e); toast('That change didn’t save. Try again.', 'error'); return false; } };
      $$('[data-att-del]', el).forEach(b => b.addEventListener('click', async () => {
        const next = [...get()]; next.splice(+b.dataset.attDel, 1);
        await save(next); paint();
      }));
      $('.att-link', el).addEventListener('submit', async (e) => {
        e.preventDefault();
        const inp = e.currentTarget.querySelector('input'), url = safeUrl(inp.value);
        if (!url) { toast('Paste a full link starting with https://', 'error'); return; }
        if ((get() || []).length >= 10) { toast('You can add up to 10 links.', 'error'); return; }
        await save([...get(), { type: 'link', name: linkName(url), url }]);
        paint();
      });
    };
    paint();
    return paint;
  }

  function assessRowHTML(a) {
    const c = S.courses.get(a.courseId), wk = assessWeek(a), st = statusOf(a, S.subs.get(a.id));
    return `<a class="as-row" href="#/assessment/${encodeURIComponent(a.id)}" style="--c:${esc(c?.accent || ACCENTS[0])}">
      <span class="as-ic">${I.clip}</span>
      <div style="min-width:0"><strong>${esc(a.title)}</strong><span class="sub">${esc(c?.title || '')}${wk ? `, week ${wk.wi + 1}` : ''}</span></div>
      <div class="right"><span class="st ${st.cls}">${esc(st.label)}</span><span>${a.dueDate ? 'Due ' + esc(fmtDue(a.dueDate)) : 'No due date'}</span></div>
    </a>`;
  }

  // ================= STUDENT: ASSESSMENTS =================
  function renderStudentAssessments() {
    const list = assessList().filter(assessOpen);
    const groups = {
      todo: list.filter(a => ['todo', 'missing'].includes(statusOf(a, S.subs.get(a.id)).key)),
      turned: list.filter(a => statusOf(a, S.subs.get(a.id)).key === 'turned'),

      appEl.innerHTML = `<div class="page"><div class="empty"><img src="IMG/fth-mark.png" alt=""><h2>This assessment isn’t available</h2><p>It may have been removed, or it belongs to a course that isn’t on your account.</p><a class="btn btn-primary" href="#/assessments">Back to assessments</a></div></div>`;

          </aside>

    const work = $('#as-work');

    const save = async (extra = {}) => {
      const data = { uid: S.user.uid, name: myName(), email: S.user.email || '', text: sub.text || '', attachments: sub.attachments || [], updatedAt: serverTimestamp(), ...extra };
      if (sub.status === 'none' && !data.status) data.status = 'draft';

        <div class="row between"><h2>Your work</h2><span class="st ${st.cls}">${esc(st.label)}</span></div>

        ${locked ? `<p class="small muted">Turned in ${esc(fmtTs(sub.submittedAt))}. You’ll get an email when it’s graded.</p>` : ''}

  // ================= ADMIN: ASSESSMENTS =================
  async function loadSubsFor(aid) {
    const m = new Map();
    const snap = await getDocs(collection(db, 'assessments', aid, 'submissions'));
    snap.forEach(d => m.set(d.id, d.data()));
    S.adminSubs.set(aid, m);
    return m;
  }

  // ---------- Minimal QR code encoder (byte mode, error correction level M, versions 1-6) ----------
  function qrMatrix(text) {
    const data = [...new TextEncoder().encode(text)];
    // [EC codewords per block, number of blocks, data codewords per block] for level M
    const SPEC = [null, [10, 1, 16], [16, 1, 28], [26, 1, 44], [18, 2, 32], [24, 2, 43], [16, 4, 27]];
    const ALIGN = [null, [], [6, 18], [6, 22], [6, 26], [6, 30], [6, 34]];
    let ver = 1;
    while (ver <= 6 && 12 + data.length * 8 > SPEC[ver][1] * SPEC[ver][2] * 8) ver++;
    if (ver > 6) throw new Error('Text too long for QR code');
    const [ecLen, nBlocks, dLen] = SPEC[ver], cap = nBlocks * dLen, size = 17 + ver * 4;
    // Bit stream: byte mode, 8-bit length, data, terminator, pad
    const bits = [];
    const put = (v, n) => { for (let i = n - 1; i >= 0; i--) bits.push((v >>> i) & 1); };
    put(4, 4); put(data.length, 8); data.forEach(b => put(b, 8));
    put(0, Math.min(4, cap * 8 - bits.length));
    while (bits.length % 8) bits.push(0);
    const cw = [];
    for (let i = 0; i < bits.length; i += 8) cw.push(bits.slice(i, i + 8).reduce((a, b) => (a << 1) | b, 0));
    for (let p = 0xEC; cw.length < cap; p ^= 0xEC ^ 0x11) cw.push(p);
    // Reed-Solomon over GF(256), polynomial 0x11D
    const EXP = new Array(512), LOG = new Array(256);
    for (let i = 0, x = 1; i < 255; i++) { EXP[i] = x; LOG[x] = i; x <<= 1; if (x & 256) x ^= 0x11D; }
    for (let i = 255; i < 512; i++) EXP[i] = EXP[i - 255];
    const mul = (a, b) => (a && b) ? EXP[LOG[a] + LOG[b]] : 0;
    let gen = [1];
    for (let i = 0; i < ecLen; i++) { const n = new Array(gen.length + 1).fill(0); gen.forEach((g, j) => { n[j] ^= g; n[j + 1] ^= mul(g, EXP[i]); }); gen = n; }
    const blocks = [], ecs = [];
    for (let b = 0; b < nBlocks; b++) {
      const blk = cw.slice(b * dLen, (b + 1) * dLen), rem = new Array(ecLen).fill(0);
      blk.forEach(v => { const f = v ^ rem.shift(); rem.push(0); for (let j = 0; j < ecLen; j++) rem[j] ^= mul(gen[j + 1], f); });
      blocks.push(blk); ecs.push(rem);
    }
    const out = [];
    for (let i = 0; i < dLen; i++) blocks.forEach(b => out.push(b[i]));
    for (let i = 0; i < ecLen; i++) ecs.forEach(e => out.push(e[i]));
    // Matrix with function patterns
    const M = Array.from({ length: size }, () => new Array(size).fill(false));
    const F = Array.from({ length: size }, () => new Array(size).fill(false));
    const setF = (x, y, dark) => { M[y][x] = dark; F[y][x] = true; };
    for (let i = 0; i < size; i++) { setF(6, i, i % 2 === 0); setF(i, 6, i % 2 === 0); }
    [[3, 3], [size - 4, 3], [3, size - 4]].forEach(([cx, cy]) => {
      for (let dy = -4; dy <= 4; dy++) for (let dx = -4; dx <= 4; dx++) {
        const x = cx + dx, y = cy + dy, d = Math.max(Math.abs(dx), Math.abs(dy));
        if (x >= 0 && x < size && y >= 0 && y < size) setF(x, y, d !== 2 && d !== 4);
      }
    });
    const al = ALIGN[ver];
    al.forEach((ay, i) => al.forEach((ax, j) => {
      if ((i === 0 && j === 0) || (i === 0 && j === al.length - 1) || (i === al.length - 1 && j === 0)) return;
      for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) setF(ax + dx, ay + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }));
    const drawFormat = (mask) => {
      const d = (0 << 3) | mask; // level M = 00
      let r = d; for (let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
      const f = ((d << 10) | r) ^ 0x5412, bit = (i) => ((f >>> i) & 1) === 1;
      for (let i = 0; i <= 5; i++) setF(8, i, bit(i));
      setF(8, 7, bit(6)); setF(8, 8, bit(7)); setF(7, 8, bit(8));
      for (let i = 9; i < 15; i++) setF(14 - i, 8, bit(i));
      for (let i = 0; i < 8; i++) setF(size - 1 - i, 8, bit(i));
      for (let i = 8; i < 15; i++) setF(8, size - 15 + i, bit(i));
      setF(8, size - 8, true);
    };
    drawFormat(0);
    // Data placement in the zigzag order
    let k = 0;
    for (let right = size - 1; right >= 1; right -= 2) {
      if (right === 6) right = 5;
      for (let v = 0; v < size; v++) for (let j = 0; j < 2; j++) {
        const x = right - j, up = ((right + 1) & 2) === 0, y = up ? size - 1 - v : v;
        if (!F[y][x] && k < out.length * 8) { M[y][x] = ((out[k >>> 3] >>> (7 - (k & 7))) & 1) === 1; k++; }
      }
    }
    const MASKS = [(x, y) => (x + y) % 2 === 0, (x, y) => y % 2 === 0, (x) => x % 3 === 0, (x, y) => (x + y) % 3 === 0,
      (x, y) => (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0, (x, y) => (x * y) % 2 + (x * y) % 3 === 0,
      (x, y) => ((x * y) % 2 + (x * y) % 3) % 2 === 0, (x, y) => ((x + y) % 2 + (x * y) % 3) % 2 === 0];
    const applyMask = (m) => { for (let y = 0; y < size; y++) for (let x = 0; x < size; x++) if (!F[y][x] && MASKS[m](x, y)) M[y][x] = !M[y][x]; };
    const penalty = () => {
      let p = 0, dark = 0;
      for (let y = 0; y < size; y++) for (let pass = 0; pass < 2; pass++) {
        let run = 1;
        for (let x = 1; x < size; x++) {
          const a = pass ? M[x - 1][y] : M[y][x - 1], b = pass ? M[x][y] : M[y][x];
          if (a === b) { run++; if (run === 5) p += 3; else if (run > 5) p++; } else run = 1;
        }
      }
      for (let y = 0; y < size - 1; y++) for (let x = 0; x < size - 1; x++) if (M[y][x] === M[y][x + 1] && M[y][x] === M[y + 1][x] && M[y][x] === M[y + 1][x + 1]) p += 3;
      M.forEach(r => r.forEach(c => { if (c) dark++; }));
      return p + Math.floor(Math.abs(dark * 20 - size * size * 10) / (size * size)) * 10;
    };
    let best = 0, bestP = Infinity;
    for (let m = 0; m < 8; m++) { applyMask(m); drawFormat(m); const pp = penalty(); if (pp < bestP) { bestP = pp; best = m; } applyMask(m); }
    applyMask(best); drawFormat(best);
    return M;
  }

  // ================= CERTIFICATES =================
  // Positions are in pixels on the 1448 x 1086 template (IMG/certificate-template.jpg).
  const CERT = {
    src: 'IMG/certificate-template.jpg', w: 1448, h: 1086,
    name: { x: 724, y: 578, maxW: 840, size: 82, font: '"Great Vibes", "Playfair Display", Georgia, serif', weight: '400' },
    course: { x: 840, y: 641, maxW: 468, size: 27, font: '"Plus Jakarta Sans", Arial, sans-serif', weight: '700' },
    date: { x: 227, y: 971, maxW: 206, size: 22, font: '"Plus Jakarta Sans", Arial, sans-serif', weight: '600' },
    id: { x: 1019, y: 971, maxW: 196, size: 20, font: '"Plus Jakarta Sans", Arial, sans-serif', weight: '600' },
    qr: { x: 1199, y: 827, w: 136, h: 138 },
    ink: '#3a2210',
  };
  const MONTHS = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const monthYearOf = (d) => `${MONTHS[d.getMonth()]} ${d.getFullYear()}`;
  // The public verification website. QR codes and share links point here.
  const VERIFY_SITE = 'https://verify.firsttechhubsolutions.com/';
  const verifyUrl = (id) => `${VERIFY_SITE}?id=${encodeURIComponent(id)}`;
  // Certificates are stored under a normalised key (capitals, letters and digits only),
  // so "fthgw250001", "FTHGW250001 " and "FTHS-2609-KFNQG4" / "fths2609kfnqg4" all match.
  const certDocKey = (id) => String(id || '').toUpperCase().replace(/[^A-Z0-9]/g, '');
  const certFromDoc = (d) => { const x = d.data() || {}; return { ...x, key: d.id, id: x.id || d.id, status: x.status || 'valid', source: x.source || 'lms' }; };
  const certKey = (uid, cid) => `${uid}|${cid}`;
  const certFor = (uid, cid) => [...S.certs.values()].find(c => c.uid === uid && c.courseId === cid) || null;
  function newCertId() {
    const d = new Date(), chars = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
    const rnd = Array.from(crypto.getRandomValues(new Uint8Array(6)), b => chars[b % chars.length]).join('');
    return `FTHS-${String(d.getFullYear()).slice(2)}${String(d.getMonth() + 1).padStart(2, '0')}-${rnd}`;
  }

  let templateImg = null;
  function loadTemplate() {
    if (templateImg) return templateImg;
    templateImg = new Promise((resolve, reject) => { const im = new Image(); im.onload = () => resolve(im); im.onerror = () => { templateImg = null; reject(new Error('Certificate template didn’t load')); }; im.src = CERT.src; });
    return templateImg;
  }

  async function drawCertificate(canvas, f, scale = 2) {
    const im = await loadTemplate();
    try { await Promise.all([document.fonts.load(`82px ${CERT.name.font}`), document.fonts.load(`700 27px ${CERT.course.font}`)]); } catch {}
    canvas.width = CERT.w * scale; canvas.height = CERT.h * scale;
    const g = canvas.getContext('2d');
    g.setTransform(scale, 0, 0, scale, 0, 0);
    g.drawImage(im, 0, 0, CERT.w, CERT.h);
    g.fillStyle = CERT.ink; g.textAlign = 'center'; g.textBaseline = 'alphabetic';
    const text = (t, p) => {
      if (!t) return;
      let size = p.size;
      do { g.font = `${p.weight} ${size}px ${p.font}`; size -= 1; } while (g.measureText(t).width > p.maxW && size > 10);
      g.fillText(t, p.x, p.y);
    };
    text(f.name, CERT.name);
    text(f.course, CERT.course);
    text(f.monthYear, CERT.date);
    text(f.id, CERT.id);
    // Replace the sample QR code with one that opens this certificate's verification page
    const q = CERT.qr;
    g.fillStyle = '#ffffff'; g.fillRect(q.x, q.y, q.w, q.h);
    if (f.id) {
      const m = qrMatrix(verifyUrl(f.id)), n = m.length, quiet = 2, cell = Math.floor((Math.min(q.w, q.h) - 4) / (n + quiet * 2) * scale) / scale;
      const side = cell * (n + quiet * 2), ox = q.x + (q.w - side) / 2 + cell * quiet, oy = q.y + (q.h - side) / 2 + cell * quiet;
      g.fillStyle = '#1c120b';
      for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) if (m[y][x]) g.fillRect(ox + x * cell, oy + y * cell, cell + 0.02, cell + 0.02);
    }
    return canvas;
  }

  // Builds a one-page PDF (landscape, same shape as the template) around a JPEG image
  function jpegToPdf(jpg, pw, ph) {
    const W = 842, H = Math.round(842 * ph / pw * 100) / 100, enc = new TextEncoder();
    const chunks = [], offs = []; let len = 0;
    const add = (c) => { const b = typeof c === 'string' ? enc.encode(c) : c; chunks.push(b); len += b.length; };
    const obj = (n, dict, stream) => { offs[n] = len; add(`${n} 0 obj\n${dict}\n`); if (stream) { add('stream\n'); add(stream); add('\nendstream\n'); } add('endobj\n'); };
    add('%PDF-1.4\n%âãÏÓ\n');
    obj(1, '<< /Type /Catalog /Pages 2 0 R >>');
    obj(2, '<< /Type /Pages /Kids [3 0 R] /Count 1 >>');
    obj(3, `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] /Resources << /XObject << /Im0 5 0 R >> >> /Contents 4 0 R >>`);
    const content = enc.encode(`q ${W} 0 0 ${H} 0 0 cm /Im0 Do Q`);
    obj(4, `<< /Length ${content.length} >>`, content);
    obj(5, `<< /Type /XObject /Subtype /Image /Width ${pw} /Height ${ph} /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length ${jpg.length} >>`, jpg);
    const xref = len;
    add(`xref\n0 6\n0000000000 65535 f \n${[1, 2, 3, 4, 5].map(i => String(offs[i]).padStart(10, '0') + ' 00000 n \n').join('')}trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF\n`);
    const out = new Uint8Array(len); let o = 0;
    chunks.forEach(c => { out.set(c, o); o += c.length; });
    return out;
  }

  async function certificatePdf(f) {
    const canvas = await drawCertificate(document.createElement('canvas'), f, 2);
    const blob = await new Promise(r => canvas.toBlob(r, 'image/jpeg', 0.9));
    return jpegToPdf(new Uint8Array(await blob.arrayBuffer()), canvas.width, canvas.height);
  }
  function toBase64(bytes) { let s = ''; for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000)); return btoa(s); }
  function downloadBytes(bytes, filename, type = 'application/pdf') {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([bytes], { type })); a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 1500);
  }
  // e.g. "Ada-Obi-FTHS-Master-Google-Workspace.pdf"
  const filePart = (t) => String(t || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^A-Za-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 50);
  const certFileName = (c) => `${[filePart(c.name), 'FTHS', filePart(c.course)].filter(Boolean).join('-')}.pdf`;
  async function downloadCertificate(c, btn) {
    if (btn) btn.disabled = true;
    try { downloadBytes(await certificatePdf(c), certFileName(c)); }
    catch (e) { console.error(e); toast('The certificate couldn’t be created. Refresh and try again.', 'error'); }
    finally { if (btn) btn.disabled = false; }
  }
  async function certThumb(img, c, scale = 0.5) {
    try { const cv = await drawCertificate(document.createElement('canvas'), c, scale); img.src = cv.toDataURL('image/jpeg', 0.8); } catch (e) { console.warn(e); }
  }

  // ---------- Completion status (admin) ----------
  function completionOf(s, c) {
    const all = sessionsOf(c);
    const done = s.progress.get(c.id) || new Set();
    const sessDone = all.filter(x => done.has(x.s.id)).length;
    const as = [...S.assess.values()].filter(a => a.courseId === c.id && a.published);
    let lastAt = s.progressAt?.get(c.id) || null;
    const turned = as.filter(a => {
      const sub = S.adminSubs.get(a.id)?.get(s.uid);
      const at = tsDate(sub?.submittedAt);
      if (at && (!lastAt || at > lastAt)) lastAt = at;
      return ['submitted', 'returned'].includes(sub?.status);
    }).length;
    return { sessDone, sessTotal: all.length, asDone: turned, asTotal: as.length, ready: all.length > 0 && sessDone === all.length && turned === as.length, lastAt };
  }
  function certRows() {
    const rows = [];
    (S.students || []).forEach(s => s.courses.filter(cid => S.courses.has(cid)).forEach(cid => {
      const c = S.courses.get(cid);
      rows.push({ s, c, st: completionOf(s, c), cert: certFor(s.uid, cid) });
    }));
    return rows;
  }
  const readyCount = () => certRows().filter(r => r.st.ready && !r.cert).length;

              <strong>${esc(c.course)}</strong><span class="small muted">Completed ${esc(c.monthYear)}. ID ${esc(c.id)}${c.status === 'revoked' ? '. Revoked' : ''}</span>
              <div class="row wrap" style="gap:8px;margin-top:10px">
                <button class="btn btn-primary btn-sm" data-cert-dl="${esc(c.key)}">${I.download} Download PDF</button>
                <a class="btn btn-outline btn-sm" href="${esc(verifyUrl(c.id))}" target="_blank" rel="noopener">Verification link</a>
              </div>
            </div>
          </article>`).join('')}
        ${waiting.map(c => `
          <article class="cert-card waiting">
            <span class="as-ic" style="--c:${esc(c.accent || ACCENTS[0])}">${I.award}</span>
            <div class="cert-card-body"><strong>You’ve finished ${esc(c.title)}!</strong><span class="small muted">Your certificate is being prepared. You’ll get it by email and it will appear here.</span></div>
          </article>`).join('')}
      </div>`;
  }
  function bindCertSection() {
    $$('[data-cert-thumb]').forEach(img => certThumb(img, S.certs.get(img.dataset.certThumb)));
    $$('[data-cert-dl]').forEach(b => b.addEventListener('click', () => downloadCertificate(S.certs.get(b.dataset.certDl), b)));
  }

  // ================= PUBLIC: VERIFY =================
  async function renderVerify(id) {
    const root = $('#auth-root');
    root.innerHTML = `<section class="verify"><div class="verify-card"><div class="spinner" style="margin:40px auto"></div></div></section>`;
    let c = null;
    try { const d = await getDoc(doc(db, 'certificates', certDocKey(id))); if (d.exists()) c = certFromDoc(d); } catch (e) { console.warn(e); }
    const revoked = c?.status === 'revoked';
    root.innerHTML = `
      <section class="verify">
        <div class="verify-card">
          <img class="verify-logo" src="IMG/fth-logo.png" alt="First Tech Hub Solutions">
          ${c ? `
            ${revoked ? `<div class="verify-bad">${I.close} Revoked</div>` : `<div class="verify-ok">${I.check} Valid certificate</div>`}
            <h1>${esc(c.name)}</h1>
            <p class="lede">${revoked ? 'This certificate was issued for' : 'completed'} <strong>${esc(c.course)}</strong> with First Tech Hub Solutions${c.monthYear ? ` in ${esc(c.monthYear)}` : ''}.${revoked ? ' It has since been revoked and is no longer valid.' : ''}</p>
            <dl class="verify-meta"><div><dt>Certificate ID</dt><dd>${esc(c.id)}</dd></div><div><dt>Issued by</dt><dd>First Tech Hub Solutions</dd></div></dl>`
          : `
            <div class="verify-bad">${I.close} Not found</div>
            <h1>We couldn’t find this certificate</h1>
            <p class="lede">No First Tech Hub Solutions certificate has the ID <strong>${esc(id)}</strong>. Check the ID, or email <a href="mailto:${SUPPORT_EMAIL}">${SUPPORT_EMAIL}</a> to confirm it.</p>`}
          <a class="small" href="#/" style="margin-top:8px">${S.user ? 'Back to the LMS' : 'Student sign in'}</a>
        </div>
      </section>`;
  }

  // ================= ADMIN: IMPORT PAST CERTIFICATES =================
  function parseCSV(text) {
    const rows = []; let row = [], cell = '', q = false;
    text = String(text).replace(/^﻿/, '');
    for (let i = 0; i < text.length; i++) {
      const ch = text[i];
      if (q) {
        if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
        else cell += ch;
      } else if (ch === '"') q = true;
      else if (ch === ',' || ch === '\t') { row.push(cell); cell = ''; }
      else if (ch === '\n' || ch === '\r') { if (ch === '\r' && text[i + 1] === '\n') i++; row.push(cell); rows.push(row); row = []; cell = ''; }
      else cell += ch;
    }
    if (cell || row.length) { row.push(cell); rows.push(row); }
    return rows.map(r => r.map(c => c.trim())).filter(r => r.some(Boolean));
  }
  function parseDate(v) {
    v = String(v || '').trim(); if (!v) return null;
    let m = v.match(/^(\d{1,2})[-/.](\d{1,2})[-/.](\d{4})$/); // day-month-year, as in the sheet
    if (m) { const d = new Date(+m[3], +m[2] - 1, +m[1]); return isNaN(d) || d.getMonth() !== +m[2] - 1 ? null : d; }
    m = v.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if (m) { const d = new Date(+m[1], +m[2] - 1, +m[3]); return isNaN(d) ? null : d; }
    const d = new Date(v); return isNaN(d) ? null : d;
  }
  const isoDay = (d) => d ? `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}` : '';
  const niceTitle = (t) => t && t === t.toUpperCase() ? t.toLowerCase().replace(/\b[a-z]/g, c => c.toUpperCase()) : t;
  const tidyName = (t) => String(t || '').replace(/\s+/g, ' ').trim().replace(/\b([a-z])/g, (m, c, i, str) => (i === 0 || str[i - 1] === ' ' || str[i - 1] === '-') ? c.toUpperCase() : c);

  function openCertImport() {
    const { el, close } = openModal({
      title: 'Import past certificates',
      body: `
        <p class="small muted" style="margin-top:-.4rem">Adds certificates you issued before the LMS, so they can be checked on the verification site. Existing IDs are kept exactly as printed.</p>
        <ol class="small" style="margin:0;padding-left:1.2rem;display:grid;gap:4px">
          <li>Open your “VALID Certificates” sheet, on the <strong>Valid Certificates</strong> tab.</li>
          <li><strong>File > Download > Comma-separated values (.csv)</strong>.</li>
          <li>Choose that file below.</li>
        </ol>
        <label class="btn btn-outline" style="justify-self:start">${I.upload} Choose CSV file<input type="file" accept=".csv,text/csv,.tsv,text/plain" hidden id="imp-file"></label>
        <details class="small"><summary style="cursor:pointer;color:var(--muted)">Or paste the rows instead</summary><textarea class="input" id="imp-paste" rows="5" placeholder="Paste from the sheet, including the header row" style="margin-top:8px;width:100%"></textarea><button class="btn btn-outline btn-sm" id="imp-paste-go" style="margin-top:6px">Read pasted rows</button></details>
        <div id="imp-preview"></div>`,
      foot: `<button class="btn btn-quiet" data-close>Cancel</button><button class="btn btn-primary" id="imp-go" disabled>Import</button>`,
    });
    let plan = null;
    const preview = $('#imp-preview', el), go = $('#imp-go', el);
    const read = async (text) => {
      const rows = parseCSV(text);
      if (rows.length < 2) { preview.innerHTML = '<p class="form-msg is-error">No rows found. Make sure you include the header row.</p>'; return; }
      const head = rows[0].map(h => h.toLowerCase());
      const col = (re) => head.findIndex(h => re.test(h));
      const C = { name: col(/full\s*name|^name$/), email: col(/e-?mail/), course: col(/course/), id: col(/certificate\s*id|cert.*id|^id$/), issued: col(/date\s*issued|issue\s*date|issued/), completed: col(/completion|completed/), status: col(/status/), batch: col(/batch/) };
      if (C.id < 0 || C.name < 0) { preview.innerHTML = '<p class="form-msg is-error">Couldn’t find the “FULL NAME” and “CERTIFICATE ID” columns. Check the first row is the header row.</p>'; return; }
      const emailToUid = new Map((S.students || []).map(s => [s.email.toLowerCase(), s.uid]));
      const courseNames = [...new Set(rows.slice(1).map(r => (r[C.course] || '').trim()).filter(Boolean))];
      const items = [], skipped = [], seen = new Set();
      rows.slice(1).forEach((r, i) => {
        const line = i + 2, id = (r[C.id] || '').trim(), name = tidyName(r[C.name]);
        if (!id && !name) return;
        if (!id) { skipped.push(`Row ${line}: no certificate ID`); return; }
        if (!name) { skipped.push(`Row ${line} (${id}): no name, so it was left out`); return; }
        const key = certDocKey(id);
        if (seen.has(key)) { skipped.push(`Row ${line} (${id}): same ID as an earlier row`); return; }
        seen.add(key);
        const issued = parseDate(r[C.issued]), completed = parseDate(r[C.completed]);
        const status = /revok|invalid|cancel/i.test(r[C.status] || '') ? 'revoked' : 'valid';
        const email = (r[C.email] || '').trim().toLowerCase();
        items.push({ key, id, name, courseRaw: (r[C.course] || '').trim(), issued, completed, status, email, uid: emailToUid.get(email) || null, batch: (r[C.batch] || '').trim() });
      });
      const existing = items.filter(x => S.certs.has(x.key));
      const clash = existing.filter(x => S.certs.get(x.key).source !== 'legacy');
      plan = { items: items.filter(x => !clash.includes(x)), courseNames };
      const guess = (n) => sortedCourses().find(c => /workspace/i.test(n) && /workspace/i.test(c.title))?.id || '';
      preview.innerHTML = `
        <div class="panel" style="padding:14px;gap:10px;background:#fbfaf8">
          <strong>${plural(plan.items.length, 'certificate')} ready to import</strong>
          <ul class="small" style="margin:0;padding-left:1.1rem">
            <li>${plan.items.filter(x => !S.certs.has(x.key)).length} new, ${plan.items.filter(x => S.certs.has(x.key)).length} already imported (will be updated)</li>
            <li>${plan.items.filter(x => x.uid).length} matched to a student’s LMS account by email, so they’ll see it on their dashboard</li>
            ${plan.items.some(x => x.status === 'revoked') ? `<li>${plan.items.filter(x => x.status === 'revoked').length} marked as revoked</li>` : ''}
            ${clash.length ? `<li style="color:var(--danger)">${clash.length} skipped: the ID is already used by a certificate issued in the LMS</li>` : ''}
            ${skipped.length ? `<li>${plural(skipped.length, 'row')} left out:<br>${skipped.slice(0, 6).map(esc).join('<br>')}${skipped.length > 6 ? '<br>…' : ''}</li>` : ''}
          </ul>
          ${courseNames.length ? `<div class="field"><span>Link each course name to an LMS course <span class="hint">So those students aren’t offered a second certificate</span></span>
            ${courseNames.map((n, i) => `<label class="row" style="gap:10px"><span class="small" style="flex:1">${esc(niceTitle(n))}</span><select class="input" data-course-map="${i}" style="max-width:260px"><option value="">Not an LMS course</option>${sortedCourses().map(c => `<option value="${esc(c.id)}" ${guess(n) === c.id ? 'selected' : ''}>${esc(c.title)}</option>`).join('')}</select></label>`).join('')}</div>` : ''}
        </div>`;
      go.disabled = !plan.items.length;
    };
    $('#imp-file', el).addEventListener('change', async (e) => { const f = e.target.files[0]; if (f) read(await f.text()); });
    $('#imp-paste-go', el).addEventListener('click', () => read($('#imp-paste', el).value));
    go.addEventListener('click', async () => {
      if (!plan) return;
      go.disabled = true; go.textContent = 'Importing…';
      const courseFor = new Map(plan.courseNames.map((n, i) => [n, $(`[data-course-map="${i}"]`, el)?.value || '']));
      try {
        for (let i = 0; i < plan.items.length; i += 400) {
          const batch = writeBatch(db);
          plan.items.slice(i, i + 400).forEach(x => {
            const when = x.completed || x.issued;
            const data = {
              id: x.id, name: x.name, course: niceTitle(x.courseRaw) || 'First Tech Hub course', courseId: courseFor.get(x.courseRaw) || null,
              monthYear: when ? monthYearOf(when) : '', issuedDate: isoDay(x.issued), completedDate: isoDay(x.completed),
              // A certificate you revoked in the LMS stays revoked even if the sheet still says VALID
              status: S.certs.get(x.key)?.status === 'revoked' ? 'revoked' : x.status, source: 'legacy', uid: x.uid || S.certs.get(x.key)?.uid || null, batch: x.batch || null, importedAt: serverTimestamp(),
            };
            batch.set(doc(db, 'certificates', x.key), data, { merge: true });
            S.certs.set(x.key, { ...data, key: x.key, importedAt: new Date() });
          });
          await batch.commit();
        }
        close(); toast(`${plural(plan.items.length, 'certificate')} imported`); S.certTab = 'issued'; renderCertificates();
      } catch (err) { console.error(err); go.disabled = false; go.textContent = 'Import'; preview.insertAdjacentHTML('beforeend', '<p class="form-msg is-error">The import didn’t finish. Check the latest Firestore rules are published, then try again. Rows already saved are kept.</p>'); }
    });
  }
</script>
